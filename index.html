<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetCore — Real Odds Scanner</title>
<style>
:root{
  --bg:#071018;--p:#0d1923;--p2:#101f2c;--l:#203241;
  --t:#eef5f8;--m:#8ea3b2;--a:#55e39b;--w:#ffd166;--d:#ff6b6b
}
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(135deg,#061017,#0a1620 55%,#071018);
  color:var(--t);font-family:Inter,system-ui,sans-serif
}
header{
  height:70px;border-bottom:1px solid var(--l);display:flex;
  align-items:center;justify-content:space-between;padding:0 5%;
  background:#071018ee;position:sticky;top:0;z-index:2
}
.logo{font-size:24px;font-weight:900}.logo span{color:var(--a)}
main{max-width:1200px;margin:auto;padding:32px 5% 60px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}
.ey{font-size:12px;color:var(--a);font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.hero h1{font-size:42px;margin:8px 0}
.hero p{color:var(--m);max-width:700px}
.btn,.input{
  border:1px solid var(--l);background:var(--p);color:var(--t);
  padding:11px 14px;border-radius:10px
}
.btn{
  background:#55e39b12;border-color:var(--a);color:var(--a);
  font-weight:800;cursor:pointer
}
.btn:disabled{opacity:.5;cursor:wait}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}
.input{min-width:170px}
.card{background:var(--p);border:1px solid var(--l);border-radius:15px;overflow:hidden}
.head,.row{
  display:grid;grid-template-columns:1.6fr .9fr 1fr .7fr .7fr;
  gap:12px;padding:15px 17px;align-items:center
}
.head{color:var(--m);font-size:11px;text-transform:uppercase}
.row{border-top:1px solid var(--l)}
.match b{display:block}
.muted{color:var(--m);font-size:12px}
.value{color:var(--a);font-weight:900}
.badge{font-size:11px;border:1px solid var(--l);padding:5px 7px;border-radius:7px}
.notice{
  margin-top:15px;padding:13px;border:1px solid var(--l);
  border-radius:10px;color:var(--m);font-size:13px;line-height:1.5
}
.ok{color:var(--a)}.err{color:var(--d)}.warn{color:var(--w)}
@media(max-width:760px){
  .hero{display:block}.hero h1{font-size:34px}.head{display:none}
  .row{grid-template-columns:1fr 1fr}
  .row>div:nth-child(3),.row>div:nth-child(4),.row>div:nth-child(5){text-align:right}
}
</style>
</head>

<body>
<header>
  <div class="logo">Bet<span>Core</span></div>
  <div id="status" class="muted">Real API: not connected</div>
</header>

<main>
<section class="hero">
  <div>
    <div class="ey">Real odds scanner</div>
    <h1>Автоматичний пошук value.</h1>
    <p>
      BetCore отримує реальні odds через серверний API-проксі.
      API-ключ зберігається тільки на сервері Render.
    </p>
  </div>
  <button id="scanBtn" class="btn" onclick="loadOdds()">↻ Сканувати</button>
</section>

<div class="controls">
  <select id="sport" class="input">
    <option value="soccer_epl">Premier League</option>
    <option value="soccer_uefa_champs_league">Champions League</option>
    <option value="soccer_spain_la_liga">La Liga</option>
    <option value="soccer_germany_bundesliga">Bundesliga</option>
    <option value="soccer_italy_serie_a">Serie A</option>
    <option value="soccer_france_ligue_one">Ligue 1</option>
  </select>

  <select id="markets" class="input">
    <option value="h2h,totals,spreads">1X2 + Totals + Spreads</option>
    <option value="h2h">1X2</option>
    <option value="totals">Totals</option>
    <option value="spreads">Spreads</option>
  </select>

  <select id="regions" class="input">
    <option value="eu">EU bookmakers</option>
    <option value="uk">UK bookmakers</option>
    <option value="us">US bookmakers</option>
  </select>
</div>

<div class="card">
  <div class="head">
    <div>Матч / ліга</div>
    <div>Ринок</div>
    <div>Вибір</div>
    <div>Коеф.</div>
    <div>Edge</div>
  </div>
  <div id="list">
    <div class="row">
      <div class="muted">Натисни «Сканувати».</div>
    </div>
  </div>
</div>

<div id="notice" class="notice">
  Готово до підключення Render API.
</div>
</main>

<script>
const API_BASE = 'https://betcore-7ws8.onrender.com';

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

async function checkServer(){
  const status = document.getElementById('status');
  try{
    const r = await fetch(`${API_BASE}/health`, {
      method:'GET',
      cache:'no-store'
    });

    if(!r.ok) throw new Error(`HTTP ${r.status}`);

    const d = await r.json();

    if(d.ok){
      status.innerHTML='<span class="ok">● Render connected</span>';
      return true;
    }

    throw new Error('Health check failed');
  }catch(e){
    status.innerHTML='<span class="err">● Render offline / CORS</span>';
    return false;
  }
}

async function loadOdds(){
  const sport = document.getElementById('sport').value;
  const markets = document.getElementById('markets').value;
  const regions = document.getElementById('regions').value;

  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const notice = document.getElementById('notice');
  const scanBtn = document.getElementById('scanBtn');

  scanBtn.disabled = true;
  status.textContent = 'Scanning…';
  list.innerHTML='<div class="row"><div>Завантаження даних…</div></div>';

  try{
    const url =
      `${API_BASE}/api/odds` +
      `?sport=${encodeURIComponent(sport)}` +
      `&markets=${encodeURIComponent(markets)}` +
      `&regions=${encodeURIComponent(regions)}`;

    const r = await fetch(url, {
      method:'GET',
      cache:'no-store'
    });

    let d;
    try{
      d = await r.json();
    }catch{
      throw new Error(`Сервер повернув не JSON (HTTP ${r.status})`);
    }

    if(!r.ok){
      throw new Error(d.message || d.error || `API error HTTP ${r.status}`);
    }

    status.innerHTML='<span class="ok">● Real API connected</span>';

    const rows = Array.isArray(d.rows) ? d.rows : [];

    if(!rows.length){
      list.innerHTML=
        '<div class="row"><div class="muted">' +
        'API відповів успішно, але подій для вибраної ліги/ринку немає.' +
        '</div></div>';

      notice.innerHTML =
        `Запит виконано. Отримано <b>${Number(d.events || 0)}</b> подій. ` +
        `Спробуй іншу лігу або ринок.`;

      return;
    }

    list.innerHTML = rows.slice(0,100).map(x => {
      const point =
        x.point !== null && x.point !== undefined && x.point !== ''
          ? ' ' + escapeHtml(x.point)
          : '';

      const edge =
        x.edge !== null && x.edge !== undefined && Number(x.edge) !== 0
          ? '+' + Number(x.edge).toFixed(1) + '%'
          : '—';

      const price =
        Number.isFinite(Number(x.price))
          ? Number(x.price).toFixed(2)
          : '—';

      return `
        <div class="row">
          <div class="match">
            <b>${escapeHtml(x.home)} — ${escapeHtml(x.away)}</b>
            <span class="muted">
              ${escapeHtml(x.league)} ·
              ${x.commence ? new Date(x.commence).toLocaleString('uk-UA') : ''}
            </span>
          </div>

          <div>
            <span class="badge">${escapeHtml(x.market)}</span>
          </div>

          <div>
            ${escapeHtml(x.name)}${point}<br>
            <span class="muted">${escapeHtml(x.bookmaker)}</span>
          </div>

          <div><b>${price}</b></div>

          <div class="value">${edge}</div>
        </div>
      `;
    }).join('');

    notice.innerHTML =
      `Отримано <b>${Number(d.events || 0)}</b> подій. ` +
      `Джерело: <b>${escapeHtml(d.source || 'The Odds API')}</b>. ` +
      `Поточний edge є ринковим baseline, а не predictive edge.`;

  }catch(e){
    status.innerHTML='<span class="err">● API error</span>';

    list.innerHTML =
      `<div class="row"><div class="err">${escapeHtml(e.message)}</div></div>`;

    notice.innerHTML =
      '<span class="warn">Не вдалося отримати odds.</span> ' +
      'Перевір Render API, CORS та ODDS_API_KEY на сервері.';
  }finally{
    scanBtn.disabled = false;
  }
}

window.addEventListener('load', checkServer);
</script>
</body>
</html>
