<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BetCore — PREMATCH</title>
<style>
:root{--bg:#071018;--p:#0c1822;--p2:#101f2c;--l:#203442;--t:#edf5f8;--m:#91a6b5;--g:#55e39b;--y:#ffd166;--r:#ff6b6b;--b:#69a9ff}
*{box-sizing:border-box}body{margin:0;background:#071018;color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
.top{position:sticky;top:0;z-index:10;height:62px;background:#071018f2;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;padding:0 16px}.brand{font-size:24px;font-weight:900}.brand b{color:var(--g)}.status{color:var(--m)}
.wrap{max-width:1100px;margin:auto;padding:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin-bottom:10px}.control,.refresh{min-height:42px;border:1px solid var(--l);border-radius:9px;background:var(--p);color:var(--t);padding:8px}.refresh{color:var(--g);border-color:var(--g);font-weight:800}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.pill{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:7px 10px;color:var(--m)}.pill b{color:var(--t)}
.card{background:var(--p);border:1px solid var(--l);border-radius:13px;margin-bottom:9px;overflow:hidden}.head{padding:13px}.time{color:var(--g);font-weight:800}.league{font-size:11px;color:var(--m);margin-top:3px}.teams{font-size:17px;font-weight:900;margin-top:5px}.q{float:right;color:var(--y);font-weight:800}
.odds{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--l)}.odd{padding:10px;border-right:1px solid var(--l)}.odd:last-child{border:0}.odd small,.book{display:block;color:var(--m);font-size:10px}.odd strong{font-size:19px;color:var(--g)}
.meta{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--l);color:var(--m);font-size:11px}.meta b{color:var(--t)}
.move{padding:10px 12px;border-top:1px solid var(--l);background:#09151e}.moveTitle{font-weight:900;margin-bottom:7px}.moveGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.box{background:var(--p2);border:1px solid var(--l);border-radius:8px;padding:7px}.box small{display:block;color:var(--m);font-size:10px}.box b{display:block;margin-top:3px}.down{color:var(--r)}.up{color:var(--g)}.flat{color:var(--m)}
.detail{display:none;position:fixed;z-index:20;inset:62px 0 0;background:var(--bg);overflow:auto;padding:12px}.detail.open{display:block}.close{float:right;background:var(--p2);color:var(--m);border:1px solid var(--l);border-radius:7px;padding:6px 10px}.section{background:var(--p);border:1px solid var(--l);border-radius:10px;margin:8px 0;padding:12px}.section h3{margin:0 0 9px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b2b37;color:var(--m)}.row:last-child{border:0}.row b{color:var(--t)}.reason{color:var(--m);font-size:12px;line-height:1.45;margin:5px 0}.outcomes{margin-top:8px;border-top:1px solid var(--l)}.outcome{padding:8px 0;border-bottom:1px solid var(--l)}.outMeta{color:var(--m);font-size:11px;margin-top:3px}
@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.moveGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand">Bet<b>Core</b> <span style="font-size:12px;color:#425663">PREMATCH</span></div><div id="status" class="status">● підключення…</div></header>
<main class="wrap">
<div class="toolbar">
<select id="horizon" class="control"><option value="24h">24 години</option><option value="3d">3 дні</option><option value="7d" selected>7 днів</option></select>
<select id="regions" class="control"><option value="eu">Європа</option><option value="uk">Британія</option><option value="us">США</option></select>
<select id="markets" class="control"><option value="h2h">1X2</option></select>
<button class="refresh" onclick="load()">↻ Оновити</button>
<input id="search" class="control search" placeholder="Пошук команди / ліги…">
</div>
<div id="stats" class="stats"></div>
<div id="list"></div>
</main>
<aside id="detail" class="detail"></aside>
<script>
const API='https://betcore-7ws8.onrender.com';let matches=[];
const $=x=>document.getElementById(x);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function kyiv(x){return new Date(x).toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function day(x){let d=new Date(x),n=new Date(),a=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Kyiv'})),b=new Date(d.toLocaleString('en-US',{timeZone:'Europe/Kyiv'}));a=new Date(a.getFullYear(),a.getMonth(),a.getDate());b=new Date(b.getFullYear(),b.getMonth(),b.getDate());let z=Math.round((b-a)/86400000);return z===0?'СЬОГОДНІ':z===1?'ЗАВТРА':`+${z} ДНІ`}
function best(m){let b=m.markets?.h2h?.best||[];return [m.home,'Draw',m.away].map(n=>b.find(x=>x.name===n)||null)}
function movementOutcomes(x){if(!x?.outcomes?.length)return '';return `<div class="outcomes">${x.outcomes.map(o=>{let cls=o.consensus==='DOWN'?'down':o.consensus==='UP'?'up':'flat';return `<div class="outcome"><div><b>${esc(o.name)}</b> <span class="${cls}">${esc(o.consensus)}</span></div><div class="outMeta">змінили: ${o.changedBookmakers} БК · ↓ ${o.down} · ↑ ${o.up} · синхронно: ${o.syncCount} БК ${esc(o.syncDirection)}</div></div>`}).join('')}</div>`}
function moveBlock(m){let x=m.engine?.movement;if(!x||x.status==='INSUFFICIENT_HISTORY')return `<div class="move"><div class="moveTitle">Рух КФ</div><div class="reason">Очікується другий snapshot. Історія вже записується.</div></div>`;let cls=x.consensus==='DOWN'?'down':x.consensus==='UP'?'up':'flat';return `<div class="move"><div class="moveTitle">Рух КФ <span class="${cls}">${esc(x.consensus)}</span></div><div class="moveGrid"><div class="box"><small>Порівняно snapshot</small><b>${x.samples}</b></div><div class="box"><small>БК зі зміною</small><b>${x.changedBookmakers}</b></div><div class="box"><small>Синхронно</small><b>${x.syncCount} БК</b></div><div class="box"><small>Напрямок</small><b class="${x.syncDirection==='DOWN'?'down':x.syncDirection==='UP'?'up':'flat'}">${esc(x.syncDirection)}</b></div></div>${movementOutcomes(x)}<div class="reason">Рух лінії не є доказом Money Flow.</div></div>`}
function card(m){let e=m.engine||{},b=best(m);return `<article class="card" onclick="detail('${esc(m.id)}')"><div class="head"><span class="q">Q ${e.matchQuality??'?'}</span><div class="time">${day(m.commence)} · ${kyiv(m.commence)}</div><div class="league">${esc(m.league)}</div><div class="teams">${esc(m.home)} — ${esc(m.away)}</div></div><div class="odds">${b.map((x,i)=>`<div class="odd"><small>${esc([m.home,'X',m.away][i])}</small><strong>${x?Number(x.price).toFixed(2):'—'}</strong><span class="book">${x?esc(x.bookmaker):'немає даних'}</span></div>`).join('')}</div><div class="meta"><span>БК: <b>${m.bookmakers?.length||0}</b></span><span>Trap: <b>${e.trapScore??'?'}</b></span><span>Edge: <b>UNKNOWN</b></span><span>No-Vig: <b>${e.marketNoVig?Number(e.marketNoVig.margin).toFixed(2)+'%':'—'}</b></span></div>${moveBlock(m)}</article>`}
function render(){let q=$('search').value.toLowerCase(),a=matches.filter(m=>!q||`${m.home} ${m.away} ${m.league}`.toLowerCase().includes(q));$('stats').innerHTML=`<span class="pill">Матчів <b>${a.length}</b></span><span class="pill">Сьогодні <b>${a.filter(x=>day(x.commence)==='СЬОГОДНІ').length}</b></span><span class="pill">Завтра <b>${a.filter(x=>day(x.commence)==='ЗАВТРА').length}</b></span><span class="pill">ПРЕМАТЧ</span>`;$('list').innerHTML=a.length?a.map(card).join(''):'<div class="section">Матчів не знайдено.</div>'}
async function detail(id){let m=matches.find(x=>x.id===id);if(!m)return;let hist=[];try{hist=(await (await fetch(`${API}/api/history?id=${encodeURIComponent(id)}`)).json()).history||[]}catch{}let e=m.engine||{},nv=e.marketNoVig,mm=m.markets?.h2h,books=mm?.bookmakers||[];let mv=e.movement||{};$('detail').innerHTML=`<button class="close" onclick="closeDetail()">✕</button><div class="section"><h2>${esc(m.home)} — ${esc(m.away)}</h2><div class="reason">${esc(m.league)} · ${kyiv(m.commence)}</div></div><div class="section"><h3>Рух КФ</h3><div class="row"><span>Статус</span><b>${esc(mv.status||'INSUFFICIENT_HISTORY')}</b></div><div class="row"><span>Загальний напрямок</span><b>${esc(mv.consensus||'UNKNOWN')}</b></div><div class="row"><span>БК зі зміною</span><b>${mv.changedBookmakers??0}</b></div><div class="row"><span>Синхронний рух</span><b>${mv.syncCount??0} БК · ${esc(mv.syncDirection||'UNKNOWN')}</b></div>${mv.outcomes?.length?`<div class="outcomes">${mv.outcomes.map(o=>`<div class="outcome"><b>${esc(o.name)} — ${esc(o.consensus)}</b><div class="outMeta">змінили: ${o.changedBookmakers} БК · ↓ ${o.down} · ↑ ${o.up} · синхронно: ${o.syncCount} БК · ${esc(o.syncDirection)}</div></div>`).join('')}</div>`:''}<div class="reason">Це аналіз зміни доступних коефіцієнтів. Money Flow тут не визначається.</div></div><div class="section"><h3>Ринок без маржі</h3>${nv?nv.outcomes.map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${Number(x.probability).toFixed(2)}% · ${Number(x.fairOdds).toFixed(2)}</b></div>`).join(''):'<div class="reason">Недостатньо даних.</div>'}</div><div class="section"><h3>Букмекери · 1X2</h3>${books.map(b=>{let o=b.outcomes||[];let g=n=>o.find(x=>x.name===n);return `<div class="row"><span>${esc(b.bookmaker)}</span><b>${g(m.home)?.price??'—'} / ${g('Draw')?.price??'—'} / ${g(m.away)?.price??'—'}</b></div>`}).join('')}</div><div class="section"><h3>Історія коефіцієнта</h3>${hist.slice(-12).reverse().map(h=>`<div class="row"><span>${kyiv(h.at)}</span><b>${(h.odds||[]).map(x=>`${esc(x.name)} ${Number(x.price).toFixed(2)}`).join(' · ')}</b></div>`).join('')||'<div class="reason">Історія накопичується.</div>'}</div>`;$('detail').classList.add('open')}
function closeDetail(){$('detail').classList.remove('open')}
async function load(){try{$('status').textContent='● сканування…';let p=new URLSearchParams({scope:'all',regions:$('regions').value,markets:$('markets').value,horizon:$('horizon').value});let r=await fetch(`${API}/api/odds?${p}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||d.message||'API error');matches=d.matches||[];$('status').innerHTML='<span style="color:var(--g)">● API підключено</span>';render()}catch(e){$('status').innerHTML='<span style="color:var(--r)">● API помилка</span>';$('list').innerHTML=`<div class="section">${esc(e.message)}</div>`}}
$('search').oninput=render;$('horizon').onchange=load;$('regions').onchange=load;window.onload=load;
</script>
</body></html>
