<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetCore — PREMATCH</title>

<style>
:root{
 --bg:#071018;
 --card:#0d1923;
 --card2:#101f2c;
 --line:#203241;
 --text:#eef5f8;
 --muted:#91a5b3;
 --green:#55e39b;
 --yellow:#ffd166;
 --red:#ff6b6b
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,Segoe UI,sans-serif
}

header{
 position:sticky;
 top:0;
 z-index:10;
 background:#071018f5;
 border-bottom:1px solid var(--line);
 padding:13px 15px
}

.top{
 max-width:1100px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{
 font-size:24px;
 font-weight:900
}

.logo b{
 color:var(--green)
}

.status{
 font-size:12px;
 color:var(--green)
}

main{
 max-width:1100px;
 margin:auto;
 padding:15px
}

.hero{
 padding:15px 0
}

.label{
 color:var(--green);
 font-size:12px;
 font-weight:900;
 letter-spacing:1.5px
}

h1{
 font-size:34px;
 line-height:1.1;
 margin:10px 0
}

.desc{
 color:var(--muted);
 line-height:1.5;
 margin-bottom:18px
}

button,select{
 width:100%;
 background:var(--card);
 color:var(--text);
 border:1px solid var(--line);
 border-radius:10px;
 padding:12px;
 font-size:15px
}

button{
 border-color:var(--green);
 color:var(--green);
 font-weight:900
}

.filters{
 display:grid;
 grid-template-columns:1fr;
 gap:8px
}

.summary{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin:12px 0
}

.pill{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:9px;
 padding:7px 10px;
 color:var(--muted);
 font-size:12px
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:15px;
 overflow:hidden;
 margin:12px 0
}

.head{
 padding:15px;
 border-bottom:1px solid var(--line)
}

.league{
 color:var(--muted);
 font-size:11px
}

.teams{
 font-size:19px;
 font-weight:900;
 margin:5px 0
}

.time{
 color:var(--green);
 font-size:12px
}

.books{
 color:var(--green);
 font-size:12px;
 margin-top:7px
}

.section{
 padding:13px 15px;
 border-bottom:1px solid var(--line)
}

.title{
 color:var(--muted);
 font-size:11px;
 font-weight:900;
 text-transform:uppercase;
 margin-bottom:9px
}

.odds{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px
}

.odd{
 background:var(--card2);
 border:1px solid var(--line);
 border-radius:9px;
 padding:9px 5px;
 text-align:center
}

.odd.best{
 border-color:var(--green)
}

.odd span{
 display:block;
 color:var(--muted);
 font-size:10px
}

.odd b{
 display:block;
 font-size:18px;
 margin-top:3px
}

.odd.best b{
 color:var(--green)
}

.book{
 color:var(--muted);
 font-size:9px
}

.engine{
 background:#09151e
}

.enginegrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px
}

.box{
 background:var(--card2);
 border:1px solid var(--line);
 border-radius:9px;
 padding:9px
}

.box span{
 display:block;
 color:var(--muted);
 font-size:10px
}

.box b{
 display:block;
 margin-top:3px;
 font-size:14px
}

.skip{
 color:var(--yellow)
}

.blocked{
 color:var(--red)
}

.note{
 color:var(--muted);
 font-size:11px;
 line-height:1.5;
 margin-top:9px
}

.data{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px
}

.dataBox{
 background:var(--card2);
 border:1px solid var(--line);
 border-radius:9px;
 padding:9px;
 font-size:11px;
 color:var(--muted)
}

.dataBox b{
 display:block;
 color:var(--text);
 margin-top:3px
}

.empty{
 padding:25px;
 text-align:center;
 color:var(--muted);
 border:1px dashed var(--line);
 border-radius:12px
}

@media(min-width:700px){
 .filters{
  grid-template-columns:repeat(4,1fr)
 }

 .enginegrid{
  grid-template-columns:repeat(4,1fr)
 }

 .data{
  grid-template-columns:repeat(4,1fr)
 }
}
</style>
</head>

<body>

<header>
 <div class="top">
  <div class="logo">Bet<b>Core</b></div>
  <div id="status" class="status">● перевірка API…</div>
 </div>
</header>

<main>

<div class="hero">
 <div class="label">BETCORE · PREMATCH</div>

 <h1>Матчі → ціна → рішення</h1>

 <div class="desc">
  Усі доступні футбольні матчі з коефіцієнтами.
  BetCore показує ціну, 1–2 букмекерів і окремо діагностику двигуна.
 </div>
</div>

<div class="filters">

 <select id="sport">
  <option value="soccer_epl">Англія · Премʼєр-ліга</option>
  <option value="soccer_uefa_champs_league">Ліга чемпіонів</option>
  <option value="soccer_spain_la_liga">Іспанія · Ла Ліга</option>
  <option value="soccer_germany_bundesliga">Німеччина · Бундесліга</option>
  <option value="soccer_italy_serie_a">Італія · Серія А</option>
  <option value="soccer_france_ligue_one">Франція · Ліга 1</option>
 </select>

 <select id="regions">
  <option value="eu">Європейські букмекери</option>
  <option value="uk">Британські букмекери</option>
  <option value="us">Американські букмекери</option>
 </select>

 <select id="horizon">
  <option value="24h">Найближчі 24 години</option>
  <option value="3d">Найближчі 3 дні</option>
  <option value="7d">Найближчі 7 днів</option>
  <option value="all">Усі майбутні матчі</option>
 </select>

 <button id="refresh">↻ Оновити лінію</button>

</div>

<div id="summary" class="summary"></div>

<div id="list">
 <div class="empty">Завантаження букмекерської лінії…</div>
</div>

</main>

<script>

const API="https://betcore-7ws8.onrender.com";

let rows=[];

function esc(x){
 return String(x??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function kyivTime(x){
 return new Date(x).toLocaleString("uk-UA",{
  timeZone:"Europe/Kyiv",
  day:"2-digit",
  month:"2-digit",
  year:"numeric",
  hour:"2-digit",
  minute:"2-digit"
 });
}

function filterTime(data){

 const now=Date.now();
 const mode=document.getElementById("horizon").value;

 let end=Infinity;

 if(mode==="24h") end=now+86400000;
 if(mode==="3d") end=now+259200000;
 if(mode==="7d") end=now+604800000;

 return data
  .filter(x=>{
   const t=Date.parse(x.commence);
   return t>=now && t<=end;
  })
  .sort((a,b)=>Date.parse(a.commence)-Date.parse(b.commence));
}

function groupMatches(data){

 const map=new Map();

 for(const r of data){

  if(!map.has(r.id)){

   map.set(r.id,{
    id:r.id,
    league:r.league,
    commence:r.commence,
    home:r.home,
    away:r.away,
    books:new Map(),
    engine:r.engine
   });

  }

  const m=map.get(r.id);

  if(!m.books.has(r.bookmaker)){
   m.books.set(r.bookmaker,[]);
  }

  m.books.get(r.bookmaker).push(r);

 }

 return [...map.values()];
}

function getH2H(match){

 const result=[];

 for(const [book,items] of match.books){

  const h2h=items.filter(x=>x.market==="h2h");

  if(h2h.length){
   result.push({
    book,
    items:h2h
   });
  }

  if(result.length===2) break;
 }

 return result;
}

function renderOdds(match){

 const books=getH2H(match);

 const outcomes=[];

 for(const b of books){

  for(const x of b.items){

   if(!outcomes.some(o=>o.name===x.name)){
    outcomes.push({
     name:x.name,
     prices:[]
    });
   }

   outcomes.find(o=>o.name===x.name)
   .prices.push({
    price:Number(x.price),
    book:b.book
   });

  }
 }

 return outcomes.slice(0,3).map((o,i)=>{

  const best=o.prices.sort((a,b)=>b.price-a.price)[0];

  const label=i===0?"1":i===1?"X":"2";

  return `
   <div class="odd best">
    <span>${label} · ${esc(o.name)}</span>
    <b>${best.price.toFixed(2)}</b>
    <div class="book">${esc(best.book)}</div>
   </div>
  `;

 }).join("");
}

function renderEngine(engine){

 const e=engine||{};

 const quality=e.matchQuality==null
  ?"UNKNOWN"
  :e.matchQuality+"/100";

 const probability=e.fairProbability==null
  ?"UNKNOWN"
  :(e.fairProbability*100).toFixed(2)+"%";

 const fairOdds=e.fairOdds==null
  ?"UNKNOWN"
  :Number(e.fairOdds).toFixed(2);

 const edge=e.edge==null
  ?"UNKNOWN"
  :(e.edge*100).toFixed(2)+"%";

 const trap=e.trapScore==null
  ?"UNKNOWN"
  :e.trapScore;

 const confirmations=Number(
  e.independentConfirmations||0
 )+"/2";

 const gate=e.noBetGate?.status||"BLOCKED";

 const decision=e.decision||"SKIP";

 const reasons=(e.noBetGate?.reasons||[
  "Незалежна Fair Probability не підключена."
 ]).map(esc).join(" · ");

 return `
 <div class="section engine">

  <div class="title">BETCORE ENGINE</div>

  <div class="enginegrid">

   <div class="box">
    <span>Match Quality</span>
    <b>${quality}</b>
   </div>

   <div class="box">
    <span>Fair Probability</span>
    <b>${probability}</b>
   </div>

   <div class="box">
    <span>Fair Odds</span>
    <b>${fairOdds}</b>
   </div>

   <div class="box">
    <span>Edge</span>
    <b>${edge}</b>
   </div>

   <div class="box">
    <span>Trap Score</span>
    <b>${trap}</b>
   </div>

   <div class="box">
    <span>Підтвердження</span>
    <b>${confirmations}</b>
   </div>

   <div class="box">
    <span>No-Bet Gate</span>
    <b class="blocked">${esc(gate)}</b>
   </div>

   <div class="box">
    <span>Рішення</span>
    <b class="skip">${esc(decision)}</b>
   </div>

  </div>

  <div class="note">
   <b>No-Bet:</b> ${reasons}
  </div>

 </div>
 `;
}

function renderMatch(m){

 const books=[...m.books.keys()];

 return `
 <article class="card">

  <div class="head">

   <div class="league">${esc(m.league)}</div>

   <div class="teams">
    ${esc(m.home)} — ${esc(m.away)}
   </div>

   <div class="time">
    ${kyivTime(m.commence)} · ПРЕМАТЧ
   </div>

   <div class="books">
    ${books.length} БК з коефіцієнтами
   </div>

  </div>

  <div class="section">

   <div class="title">
    1X2 · найкраща ціна з 1–2 БК
   </div>

   <div class="odds">
    ${renderOdds(m)}
   </div>

  </div>

  ${renderEngine(m.engine)}

  <div class="section">

   <div class="title">Рух КФ · гроші · CLV</div>

   <div class="data">

    <div class="dataBox">
     Рух коефіцієнта
     <b>UNKNOWN</b>
    </div>

    <div class="dataBox">
     Money Flow
     <b>UNKNOWN</b>
    </div>

    <div class="dataBox">
     Sharp Money
     <b>UNKNOWN</b>
    </div>

    <div class="dataBox">
     CLV
     <b>UNKNOWN</b>
    </div>

   </div>

   <div class="note">
    Дані не вигадуються. Для цих показників
    потрібна історія руху лінії та джерело money flow.
   </div>

  </div>

  <div class="section">

   <div class="title">
    Історичні події за КФ
   </div>

   <div class="dataBox">
    <span class="unknown">
     Історична база ще не підключена.
     Після підключення тут буде:
     КФ входу → аналогічні випадки → результат → ROI.
    </span>
   </div>

  </div>

 </article>
 `;
}

function rebuild(){

 const filtered=filterTime(rows);

 const matches=groupMatches(filtered);

 document.getElementById("summary").innerHTML=`

  <span class="pill">
   Матчів: <b>${matches.length}</b>
  </span>

  <span class="pill">
   Букмекерських позицій: <b>${filtered.length}</b>
  </span>

  <span class="pill">
   1–2 БК
  </span>

  <span class="pill">
   Час: <b>Київ</b>
  </span>

  <span class="pill">
   <b>ПРЕМАТЧ</b>
  </span>
 `;

 if(!matches.length){

  document.getElementById("list").innerHTML=`
   <div class="empty">
    Немає майбутніх матчів
    із доступними коефіцієнтами
    у вибраному часовому діапазоні.
   </div>
  `;

  return;
 }

 document.getElementById("list").innerHTML=
  matches.map(renderMatch).join("");
}

async function loadOdds(){

 const button=document.getElementById("refresh");

 button.disabled=true;

 document.getElementById("list").innerHTML=`
  <div class="empty">
   Завантаження букмекерської лінії…
  </div>
 `;

 try{

  const sport=
   document.getElementById("sport").value;

  const regions=
   document.getElementById("regions").value;

  const url=
   API+
   "/api/odds?sport="+
   encodeURIComponent(sport)+
   "&markets=h2h,totals,spreads"+
   "&regions="+
   encodeURIComponent(regions);

  const response=
   await fetch(url,{cache:"no-store"});

  const data=
   await response.json();

  if(!response.ok){
   throw new Error(
    data.message||
    data.error||
    "Помилка API"
   );
  }

  rows=
   Array.isArray(data.rows)
   ?data.rows
   :[];

  document.getElementById("status").innerHTML=
   "● API підключено";

  rebuild();

 }catch(error){

  document.getElementById("list").innerHTML=`
   <div class="empty" style="color:var(--red)">
    ${esc(error.message)}
   </div>
  `;

 }finally{

  button.disabled=false;

 }

}

async function health(){

 try{

  const r=
   await fetch(
    API+"/health",
    {cache:"no-store"}
   );

  if(!r.ok) throw 0;

  document.getElementById("status").innerHTML=
   "● API підключено";

 }catch{

  document.getElementById("status").innerHTML=
   "● API недоступний";

 }

}

document
 .getElementById("refresh")
 .addEventListener("click",loadOdds);

document
 .getElementById("horizon")
 .addEventListener("change",rebuild);

window.addEventListener("load",()=>{

 health();
 loadOdds();

});

</script>

</body>
</html>
