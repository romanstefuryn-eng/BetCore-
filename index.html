<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BetCore — PREMATCH</title>
<style>
:root{--bg:#071018;--panel:#0c1822;--panel2:#101f2c;--line:#203442;--text:#edf5f8;--muted:#91a6b5;--green:#55e39b;--yellow:#ffd166;--red:#ff6b6b;--blue:#69a9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#102536 0,#071018 42%);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;height:64px;background:#071018f2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;backdrop-filter:blur(10px)}.brand{font-size:25px;font-weight:950;letter-spacing:-1px}.brand b{color:var(--green)}.status{color:var(--muted);font-weight:700}.ok{color:var(--green)}.bad{color:var(--red)}
.wrap{max-width:1420px;margin:auto;padding:18px 18px 50px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:14px}.nav button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 12px;border-radius:9px;white-space:nowrap}.nav button.active{color:var(--green);border-color:#55e39b66;background:#55e39b0e}
.toolbar{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto auto;gap:8px;margin-bottom:12px}.control{min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 11px;outline:none}.control:focus{border-color:#55e39b66}.refresh{border:1px solid var(--green);background:#55e39b12;color:var(--green);font-weight:850;border-radius:9px;padding:0 15px}.refresh:disabled{opacity:.5}.search{min-width:170px}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.pill{border:1px solid var(--line);background:#0b1720;padding:7px 10px;border-radius:8px;color:var(--muted)}.pill b{color:var(--text)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(390px,500px);gap:12px}.list,.detail{min-width:0}.empty{border:1px solid var(--line);background:var(--panel);padding:20px;border-radius:12px;color:var(--muted);line-height:1.55}.match{border:1px solid var(--line);background:var(--panel);border-radius:13px;margin-bottom:8px;overflow:hidden}.match:hover{border-color:#365061}.matchHead{padding:13px 14px;display:flex;gap:12px;justify-content:space-between}.time{font-size:12px;color:var(--green);font-weight:800}.league{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teams{font-size:16px;font-weight:900;line-height:1.35;margin-top:5px}.side{min-width:72px;text-align:right}.tag{display:inline-block;font-size:10px;border:1px solid var(--line);padding:3px 6px;border-radius:6px;color:var(--muted)}.decision{font-size:11px;font-weight:900;margin-top:5px}.skip{color:var(--yellow)}.watch{color:var(--blue)}.bet{color:var(--green)}
.odds{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.odd{padding:10px 12px;border-right:1px solid var(--line)}.odd:last-child{border-right:0}.odd small{display:block;color:var(--muted);font-size:10px}.odd strong{font-size:18px}.odd.best strong{color:var(--green)}.book{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movement{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px}.movement b{color:var(--text)}
.detail{position:sticky;top:76px;height:calc(100vh - 90px);overflow:auto;border:1px solid var(--line);background:var(--panel);border-radius:13px}.detailHead{padding:17px;border-bottom:1px solid var(--line)}.detailTitle{font-size:21px;font-weight:950}.sub{color:var(--muted);font-size:12px;margin-top:4px}.engine{padding:13px;background:#09151e;border-bottom:1px solid var(--line)}.engineTitle{font-weight:950;display:flex;justify-content:space-between}.engineGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.box{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px}.box label{display:block;color:var(--muted);font-size:11px}.box strong{display:block;font-size:16px;margin-top:4px}.unknown{color:var(--muted)}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
.section{padding:13px;border-bottom:1px solid var(--line)}.section h3{font-size:15px;margin:0 0 10px}.mini{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding:8px 0;border-bottom:1px solid #1b2b37;color:var(--muted)}.mini:last-child{border:0}.mini b{color:var(--text)}.reason{margin:5px 0;color:var(--muted);font-size:12px;line-height:1.45}.bar{height:7px;background:#172733;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.bookTable{width:100%;border-collapse:collapse}.bookTable th,.bookTable td{padding:8px 6px;border-bottom:1px solid #1b2b37;text-align:right}.bookTable th:first-child,.bookTable td:first-child{text-align:left}.bookTable th{font-size:10px;color:var(--muted)}.max{color:var(--green);font-weight:900}.historyRow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b2b37;font-size:11px}.historyRow span{color:var(--muted)}
.notice{padding:10px 12px;border:1px solid var(--line);background:#09151e;color:var(--muted);border-radius:9px;margin-bottom:10px;line-height:1.4}.warn{color:var(--yellow)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.detail{position:fixed;inset:64px 0 0 0;border-radius:0;z-index:15;display:none}.detail.open{display:block}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.top{padding:0 14px}.wrap{padding:12px}.closeDetail{display:block!important}}
@media(min-width:901px){.closeDetail{display:none!important}}
.closeDetail{float:right;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;padding:5px 8px}
</style>
</head>
<body>
<header class="top"><div class="brand">Bet<b>Core</b> <span style="color:#324553;font-size:14px">ENGINE</span></div><div id="status" class="status">● підключення…</div></header>
<main class="wrap">
<div class="nav"><button class="active">Матчі</button><button>Аналіз</button><button>Історія КФ</button><button>Статистика</button><button>Налаштування</button></div>
<div class="toolbar">
<select id="scope" class="control"><option value="all">⚽ Усі доступні футбольні ліги</option></select>
<select id="day" class="control"><option value="24h">Сьогодні + найближчі 24 год</option><option value="3d">Сьогодні + 3 дні</option><option value="7d" selected>Сьогодні + 7 днів</option></select>
<select id="regions" class="control"><option value="eu">Європейські букмекери</option><option value="uk">Британські букмекери</option><option value="us">Американські букмекери</option></select>
<select id="markets" class="control"><option value="h2h">1X2 — основний скан</option><option value="h2h,totals">1X2 + Тотали</option><option value="h2h,spreads">1X2 + Фори</option></select>
<input id="search" class="control search" placeholder="Пошук команди / ліги…">
<button id="refresh" class="refresh" onclick="loadOdds()">↻ Оновити</button>
</div>
<div class="notice">BetCore тепер сканує не одну лігу, а пакет футбольних ліг, і перед показом відсікає матчі, що вже далеко за горизонтом. Дані Money Flow / Sharp / склади / xG не вигадуються.</div>
<div id="stats" class="stats"></div>
<div class="layout"><section id="list" class="list"></section><aside id="detail" class="detail"></aside></div>
</main>
<script>
const API_BASE='https://betcore-7ws8.onrender.com';
let matches=[];let selectedId=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function kyiv(iso){return new Date(iso).toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dayLabel(iso){const d=new Date(iso);const n=new Date();const a=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Kyiv'}));const b=new Date(d.toLocaleString('en-US',{timeZone:'Europe/Kyiv'}));const ad=new Date(a.getFullYear(),a.getMonth(),a.getDate());const bd=new Date(b.getFullYear(),b.getMonth(),b.getDate());const diff=Math.round((bd-ad)/86400000);return diff===0?'СЬОГОДНІ':diff===1?'ЗАВТРА':diff===2?'+2 ДНІ':diff===3?'+3 ДНІ':`+${diff} ДНІ`}
function bestH2H(m){const b=m.markets?.h2h?.best||[];const order=[m.home,'Draw',m.away];return order.map(n=>b.find(x=>x.name===n)||b.find(x=>n==='Draw'&&/draw|tie|draw/i.test(x.name))||null)}
function h2hNames(m){return [m.home,'X',m.away]}
function engineClass(e){return e?.decision==='BET'?'bet':e?.decision==='WATCH'?'watch':'skip'}
function renderCard(m){const e=m.engine||{};const best=bestH2H(m);const labels=h2hNames(m);return `<article class="match" onclick="openDetail('${esc(m.id)}')"><div class="matchHead"><div><div class="time">${dayLabel(m.commence)} · ${kyiv(m.commence)}</div><div class="league">${esc(m.league)} · ${esc(m.sportKey)}</div><div class="teams">${esc(m.home)} — ${esc(m.away)}</div></div><div class="side"><span class="tag">Q ${e.matchQuality??'?'}</span><div class="decision ${engineClass(e)}">${esc(e.decision||'SKIP')}</div></div></div><div class="odds">${best.map((x,i)=>`<div class="odd ${x?'best':''}"><small>${labels[i]}</small><strong>${x?Number(x.price).toFixed(2):'—'}</strong><div class="book">${x?esc(x.bookmaker):'немає даних'}</div></div>`).join('')}</div><div class="movement"><span>БК: <b>${m.bookmakers?.length||0}</b></span><span>Trap: <b>${e.trapScore==null?'?':e.trapScore}</b></span><span>Edge: <b>UNKNOWN</b></span><span>Market No-Vig: <b>${e.marketNoVig?Number(e.marketNoVig.margin).toFixed(2)+'%':'—'}</b></span></div></article>`}
function renderList(){const q=$('search').value.trim().toLowerCase();const arr=matches.filter(m=>!q||`${m.home} ${m.away} ${m.league}`.toLowerCase().includes(q));$('list').innerHTML=arr.length?arr.map(renderCard).join(''):`<div class="empty">У вибраному періоді немає матчів із доступною лінією. Зміни горизонт або пошук.</div>`;$('stats').innerHTML=`<span class="pill">Матчів <b>${arr.length}</b></span><span class="pill">Сьогодні <b>${arr.filter(x=>dayLabel(x.commence)==='СЬОГОДНІ').length}</b></span><span class="pill">Завтра <b>${arr.filter(x=>dayLabel(x.commence)==='ЗАВТРА').length}</b></span><span class="pill">Ліг у відповіді <b>${new Set(arr.map(x=>x.league)).size}</b></span><span class="pill">ПРЕМАТЧ</span>`}
function renderEngine(e){const nv=e.marketNoVig;return `<div class="engine"><div class="engineTitle"><span>BETCORE ENGINE</span><span class="${engineClass(e)}">${esc(e.decision||'SKIP')}</span></div><div class="engineGrid"><div class="box"><label>Match Quality</label><strong>${e.matchQuality??'UNKNOWN'}/100</strong></div><div class="box"><label>Fair Probability</label><strong class="unknown">UNKNOWN</strong></div><div class="box"><label>Fair Odds</label><strong class="unknown">UNKNOWN</strong></div><div class="box"><label>Edge</label><strong class="unknown">UNKNOWN</strong></div><div class="box"><label>Підтвердження</label><strong>0/2</strong></div><div class="box"><label>Trap Score</label><strong>${e.trapScore==null?'UNKNOWN':e.trapScore}</strong></div><div class="box"><label>No-Bet Gate</label><strong class="red">BLOCKED</strong></div><div class="box"><label>Рішення</label><strong class="yellow">SKIP</strong></div></div></div>`}
function renderDetail(m){const e=m.engine||{};const market=m.markets?.h2h;const hist=window.currentHistory||[];let books=(market?.bookmakers||[]).slice(0,12);const best=market?.best||[];return `<button class="closeDetail" onclick="closeDetail(event)">✕</button><div class="detailHead"><div class="detailTitle">${esc(m.home)} — ${esc(m.away)}</div><div class="sub">${esc(m.league)} · ${kyiv(m.commence)} · PREMATCH · ${m.bookmakers?.length||0} БК</div></div>${renderEngine(e)}<div class="section"><h3>1X2 · найкращі доступні ціни</h3><div class="mini"><span>Результат</span><b>КФ</b><b>БК</b></div>${best.map(x=>`<div class="mini"><span>${esc(x.name)}</span><b class="green">${Number(x.price).toFixed(2)}</b><span>${esc(x.bookmaker)}</span></div>`).join('')}</div><div class="section"><h3>Ринок без маржі (no-vig)</h3>${e.marketNoVig?`<div class="reason">Маржа найкращої доступної лінії: <b>${Number(e.marketNoVig.margin).toFixed(2)}%</b></div>${e.marketNoVig.outcomes.map(x=>`<div class="mini"><span>${esc(x.name)}</span><b>${Number(x.probability).toFixed(2)}%</b><b>${Number(x.fairOdds).toFixed(2)}</b></div>`).join('')}`:'<div class="reason">Недостатньо даних для no-vig.</div>'}</div><div class="section"><h3>Букмекери · 1X2</h3><table class="bookTable"><thead><tr><th>БК</th><th>1</th><th>X</th><th>2</th></tr></thead><tbody>${books.map(b=>{const o=b.outcomes||[];const get=n=>o.find(x=>x.name===n);return `<tr><td>${esc(b.bookmaker)}</td><td>${get(m.home)?.price?Number(get(m.home).price).toFixed(2):'—'}</td><td>${get('Draw')?.price?Number(get('Draw').price).toFixed(2):'—'}</td><td>${get(m.away)?.price?Number(get(m.away).price).toFixed(2):'—'}</td></tr>`}).join('')}</tbody></table></div><div class="section"><h3>Дані BETCORE</h3><div class="reason">Money Flow: <b>UNKNOWN</b></div><div class="reason">Sharp / Exchange: <b>UNKNOWN</b></div><div class="reason">Lineup: <b>UNKNOWN</b></div><div class="reason">xG / xGA: <b>UNKNOWN</b></div><div class="reason">Odds history: <b>${hist.length?'AVAILABLE':'UNKNOWN'}</b></div></div><div class="section"><h3>Історія коефіцієнта</h3>${hist.length?hist.slice(-12).reverse().map(h=>`<div class="historyRow"><span>${kyiv(h.at)}</span><b>${(h.odds||[]).map(x=>`${esc(x.name)} ${Number(x.price).toFixed(2)}`).join(' · ')}</b></div>`).join(''):'<div class="reason">Історія почне накопичуватися після оновлень лінії. CLOSE/CLV не вигадуються.</div>'}</div><div class="section"><h3>No-Bet Gate</h3>${(e.noBetGate?.reasons||[]).map(r=>`<div class="reason">• ${esc(r)}</div>`).join('')}</div>`}
async function openDetail(id){selectedId=id;const m=matches.find(x=>x.id===id);if(!m)return;try{const r=await fetch(`${API_BASE}/api/history?id=${encodeURIComponent(id)}`,{cache:'no-store'});const d=await r.json();window.currentHistory=d.history||[]}catch{window.currentHistory=[]}$('detail').innerHTML=renderDetail(m);$('detail').classList.add('open');}
function closeDetail(e){if(e)e.stopPropagation();$('detail').classList.remove('open')}
async function loadOdds(){const btn=$('refresh');btn.disabled=true;$('list').innerHTML='<div class="empty">Сканую футбольні ліги та відсікаю матчі за горизонтом…</div>';try{const qs=new URLSearchParams({scope:$('scope').value,regions:$('regions').value,markets:$('markets').value,horizon:$('day').value});const r=await fetch(`${API_BASE}/api/odds?${qs}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||`HTTP ${r.status}`);matches=d.matches||[];$('status').innerHTML='<span class="ok">● API підключено</span>';$('status').title=`Ліг: ${d.coverage?.sportsQueried||0}, матчів: ${matches.length}`;renderList();if(selectedId){const m=matches.find(x=>x.id===selectedId);if(m)openDetail(selectedId)} }catch(e){$('status').innerHTML='<span class="bad">● API помилка</span>';$('list').innerHTML=`<div class="empty"><b>Помилка:</b> ${esc(e.message)}</div>`}finally{btn.disabled=false}}
$('search').addEventListener('input',renderList);$('day').addEventListener('change',loadOdds);$('regions').addEventListener('change',loadOdds);$('markets').addEventListener('change',loadOdds);window.addEventListener('load',()=>{fetch(`${API_BASE}/health`).then(r=>r.json()).then(d=>{$('status').innerHTML=d.ok&&d.apiKeyConfigured?'<span class="ok">● API підключено</span>':'<span class="bad">● API не налаштовано</span>'}).catch(()=>{$('status').innerHTML='<span class="bad">● API недоступний</span>'});loadOdds()});
</script></body></html>
